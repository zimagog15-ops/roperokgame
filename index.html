<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>ROPEROK: КАРЬЕРА</title><script>const u='https://' + 'unp' + '://kg.com scripts=[u+'@vkontakte/vk-bridge/dist/browser.min.js',u+'react@18/umd/react.production.min.js',u+'react-dom@18/umd/react-dom.production.min.js',u+'@babel/standalone/babel.min.js'];scripts.forEach(src=>{const s=document.createElement('script');s.src=src;s.async=false;document.head.appendChild(s);});</script><style>body{background:#0b0b0d;color:#fff;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Roboto",sans-serif;user-select:none;padding:0;margin:0;box-sizing:border-box}.container{padding:20px;max-width:500px;margin:0 auto;box-sizing:border-box}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;transition:opacity .2s}.btn:active{opacity:.8}.btn-blue{background:#007fff;color:#fff}.btn-gold{background:#ffd700;color:#000}.btn-green{background:#39ff14;color:#000}.btn-grey{background:#333;color:#fff}.stats-box{display:flex;justify-content:space-between;background:#16161a;padding:15px;margin-bottom:25px;border:1px solid #222;border-radius:12px}.level-card{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#1c1c22;border-radius:12px;border:1px solid #222;margin-bottom:12px}.level-card.locked{opacity:.5;background:#121215}.shop-card{background:#16161a;padding:15px;border-radius:12px;border:1px solid #222;margin-bottom:12px}.game-area{width:100%;height:350px;background:#111;position:relative;border-radius:12px;overflow:hidden;margin-bottom:20px;border:2px solid #333}.lane{width:33.33%;height:100%;float:left;border-right:1px dashed #222;position:relative;box-sizing:border-box}.lane:last-child{border-right:none}.note{width:80%;height:20px;left:10%;position:absolute;border-radius:6px;transform:translateY(-50%)}.hit-zone{position:absolute;bottom:20px;width:100%;height:10px;background:rgba(255,255,255,.2)}.tap-buttons{display:flex;gap:10px}</style></head><body><div id="root"></div><script type="text/babel">window.onload=()=>{const vkBridge=window.vkBridge;const LEVELS_DATA=[{id:1,title:"Путь из села (Intro)",album:"Из села",bpm:90,requiredScore:0,notes:[{time:1000,line:0},{time:2000,line:1},{time:3000,line:2},{time:4000,line:1},{time:5000,line:0}]},{id:2,title:"Аритмия (Radio Edit)",album:"Аритмия",bpm:120,requiredScore:200,notes:[{time:1000,line:0},{time:1500,line:1},{time:2000,line:2},{time:2500,line:1},{time:3000,line:0}]},{id:3,title:"Стена из звука",album:"Стена из звука",bpm:140,requiredScore:400,notes:[{time:800,line:0},{time:1200,line:2},{time:1600,line:1},{time:2000,line:0},{time:2400,line:2}]}];function GameEngine({level,noteColor,onFinish}){const[score,setScore]=React.useState(0);const[activeNotes,setActiveNotes]=React.useState([]);const startTime=React.useRef(Date.now());React.useEffect(()=>{const interval=setInterval(()=>{const elapsed=Date.now()-startTime.current;const currentNotes=level.notes.map(note=>{const noteAge=elapsed-note.time;const speed=0.3;const yPosition=noteAge*speed;return{...note,y:yPosition}}).filter(note=>note.y>-20&&note.y<360);setActiveNotes(currentNotes);if(elapsed>7000){clearInterval(interval);onFinish(score)}},30);return()=>clearInterval(interval)},[level,score]);const handleTap=lineIndex=>{const targetNote=activeNotes.find(n=>n.line===lineIndex&&n.y>=300&&n.y<=340);if(targetNote){setScore(prev=>prev+100)}};const notesLine0=activeNotes.filter(n=>n.line===0);const notesLine1=activeNotes.filter(n=>n.line===1);const notesLine2=activeNotes.filter(n=>n.line===2);return(<div className="container"><h3>Играет: {level.title}</h3><h4>Счет: {score}</h4><div className="game-area"><div className="hit-zone"></div><div className="lane">{notesLine0.map((n,i)=>(<div key={i} className="note" style={{top:n.y+"px",background:noteColor}}></div>))}</div><div className="lane">{notesLine1.map((n,i)=>(<div key={i} className="note" style={{top:n.y+"px",background:noteColor}}></div>))}</div><div className="lane">{notesLine2.map((n,i)=>(<div key={i} className="note" style={{top:n.y+"px",background:noteColor}}></div>))}</div></div><div className="tap-buttons"><button className="btn btn-blue" onClick={()=>handleTap(0)}>L</button><button className="btn btn-blue" onClick={()=>handleTap(1)}>C</button><button className="btn btn-blue" onClick={()=>handleTap(2)}>R</button></div></div>)}function App(){const[screen,setScreen]=React.useState('menu');const[coins,setCoins]=React.useState(0);const[highScore,setHighScore]=React.useState(0);const[selectedLevel,setSelectedLevel]=React.useState(null);const[noteColor,setNoteColor]=React.useState('#4da6ff');const[userId,setUserId]=React.useState(null);const[archive,setArchive]=React.useState([{id:'c1',title:"Как писалась 'Аритмия'",description:"Секретный факт: этот бит был придуман в 3 часа ночи на коленке.",cost:100,isOwned:false},{id:'c2',title:"Первый микрофон",description:"Запись первых треков в селе шла на обычный динамический микрофон.",cost:300,isOwned:false}]);const[skins,setSkins]=React.useState([{id:'s1',name:"Классика (Синий)",color:"#4da6ff",cost:0,isOwned:true},{id:'s2',name:"Кислотный Неон",color:"#39ff14",cost:150,isOwned:false}]);React.useEffect(()=>{async function initVK(){try{await vkBridge.send('VKWebAppInit');const user=await vkBridge.send('VKWebAppGetUserInfo');setUserId(user.id);const storageData=await vkBridge.send('VKWebAppStorageGet',{keys:['roperok_progress']});if(storageData.keys&&storageData.keys.value){const save=JSON.parse(storageData.keys.value);if(save.coins)setCoins(save.coins);if(save.highScore)setHighScore(save.highScore);if(save.ownedCards)setArchive(prev=>prev.map(c=>({...c,isOwned:save.ownedCards.includes(c.id)})));if(save.ownedSkins)setSkins(prev=>prev.map(s=>({...s,isOwned:save.ownedSkins.includes(s.id)})))}}catch(e){console.log("Запуск вне ВК",e)}}initVK()},[]);const saveProgress=async(newCoins,newHighScore,currentArchive,currentSkins)=>{if(!userId)return;try{const saveData=JSON.stringify({coins:newCoins,highScore:newHighScore,ownedCards:currentArchive.filter(c=>c.isOwned).map(c=>c.id),ownedSkins:currentSkins.filter(s=>s.isOwned).map(s=>s.id)});await vkBridge.send('VKWebAppStorageSet',{key:'roperok_progress',value:saveData})}catch(e){console.error(e)}};const buyCard=(cardId,cost)=>{if(coins>=cost){const updatedCoins=coins-cost;const updatedArchive=archive.map(c=>c.id===cardId?{...c,isOwned:true}:c);setCoins(updatedCoins);setArchive(updatedArchive);saveProgress(updatedCoins,highScore,updatedArchive,skins)}};const buySkin=skin=>{if(skin.isOwned){setNoteColor(skin.color)}else if(coins>=skin.cost){const updatedCoins=coins-skin.cost;const updatedSkins=skins.map(s=>s.id===skin.id?{...s,isOwned:true}:s);setCoins(updatedCoins);setSkins(updatedSkins);setNoteColor(skin.color);saveProgress(updatedCoins,highScore,archive,updatedSkins)}};return(<div>{screen==='menu'&&(<div className="container"><h1 style={{textAlign:'center',color:'#007fff',margin:'10px 0'}}>ROPEROK: КАРЬЕРА</h1><div className="stats-box"><span>🪙 Монеты: <b>{coins}</b></span><span>🏆 Рекорд: <b>{highScore}</b></span></div>{LEVELS_DATA.map(lvl=>{const isUnlocked=highScore>=lvl.requiredScore;return(<div key={lvl.id} className={"level-card "+(!isUnlocked?"locked":"")}><div><h4 style={{margin:0}}>{lvl.title}</h4><span style={{fontSize:'12px',color:'#aaa'}}>{lvl.album}</span></div>{isUnlocked?(<button className="btn btn-blue" style={{width:'auto',padding:'8px 16px'}} onClick={()=>{setSelectedLevel(lvl);setScreen('game')}}>СТАРТ</button>):(<span style={{fontSize:'11px',color:'#ff4d4d'}}>🔒 Нужен рекорд: {lvl.requiredScore}</span>)}</div>)})} <button className="btn btn-gold" style={{marginTop:'20px'}} onClick={()=>setScreen('shop')}>🏪 МАГАЗИН НАГРАД</button></div>)}{screen==='game'&&selectedLevel&&(<GameEngine level={selectedLevel} noteColor={noteColor} onFinish={scoreGained=>{const newCoins=coins+Math.floor(scoreGained/10);const newHighScore=Math.max(highScore,scoreGained);setCoins(newCoins);setHighScore(newHighScore);saveProgress(newCoins,newHighScore,archive,skins);setScreen('menu')}}/>)}{screen==='shop'&&(<div className="container"><h2>🏪 Секретный Архив</h2>{archive.map(card=>(<div key={card.id} className="shop-card"><h4>{card.title}</h4><p style={{fontSize:'14px',color:'#ccc'}}>{card.description}</p>{card.isOwned?(<span style={{color:'#39ff14',fontWeight:'bold'}}>✓ Открыто в архиве</span>):(<button className="btn btn-blue" disabled={coins<card.cost} onClick={() => buyCard(card.id, card.cost)}>Купить за {card.cost} 🪙</button>)}</div>))}<h2>🎨 Кастомизация нот</h2>{skins.map(skin=>(<div key={skin.id} className="shop-card" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><span style={{color:skin.color,fontWeight:'bold'}}>■</span> {skin.name}</div><button className="btn btn-grey" style={{width:'auto',padding:'8px 16px'}} onClick={()=>buySkin(skin)}>{skin.isOwned?(noteColor===skin.color?'Выбрано':'Надеть'):"Купить: "+skin.cost+" 🪙"}</button></div>))}<button className="btn btn-blue" style={{marginTop:'20px'}} onClick={()=>setScreen('menu')}>Назад в меню</button></div>)}</div>)}const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);};</script></body></html>
