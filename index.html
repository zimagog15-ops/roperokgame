<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ROPEROK: КАРЬЕРА</title>
    <!-- Стили -->
    <style>
      body {
        background: #0b0b0d;
        color: #fff;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
        user-select: none;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        padding: 20px;
        max-width: 500px;
        margin: 0 auto;
        box-sizing: border-box;
      }
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-bottom: 10px;
        text-align: center;
      }
      .btn:active {
        opacity: 0.8;
      }
      .btn-blue {
        background: #007fff;
        color: #fff;
      }
      .btn-gold {
        background: #ffd700;
        color: #000;
      }
      .btn-grey {
        background: #333;
        color: #fff;
      }
      .stats-box {
        display: flex;
        justify-content: space-between;
        background: #16161a;
        padding: 15px;
        margin-bottom: 25px;
        border: 1px solid #222;
        border-radius: 12px;
      }
      .level-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        background: #1c1c22;
        border-radius: 12px;
        border: 1px solid #222;
        margin-bottom: 12px;
      }
      .level-card.locked {
        opacity: 0.5;
        background: #121215;
      }
      .shop-card {
        background: #16161a;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #222;
        margin-bottom: 12px;
      }
      .game-area {
        width: 100%;
        height: 350px;
        background: #111;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
        border: 2px solid #333;
      }
      .lane {
        width: 33.33%;
        height: 100%;
        float: left;
        border-right: 1px dashed #222;
        position: relative;
        box-sizing: border-box;
      }
      .lane:last-child {
        border-right: none;
      }
      .note {
        width: 80%;
        height: 20px;
        left: 10%;
        position: absolute;
        border-radius: 6px;
        transform: translateY(-50%);
      }
      .hit-zone {
        position: absolute;
        bottom: 20px;
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.2);
      }
      .tap-buttons {
        display: flex;
        gap: 10px;
      }
      .hidden {
        display: none !important;
      }
    </style>

    <!-- VK Bridge встроен прямо в страницу (без внешних CDN) -->
    <script>
      (function() {
        var w = window, v = 'vkBridge', d = 'vk-bridge-ready', e = 'vk-bridge-error';
        if (w[v]) return;
        var b = w[v] = { _initialized: false, _callbacks: [], _result: null };
        b.send = function(m, d) {
          if (!b._initialized) { b._callbacks.push({ m: m, d: d }); return; }
          var i = 'bridge' + Math.random().toString(36).substr(2, 9);
          w.postMessage(JSON.stringify({ type: 'vk-bridge', method: m, data: d, id: i }), '*');
          return new Promise(r => {
            var t = setTimeout(() => r(null), 5000);
            w[i] = (res) => { clearTimeout(t); r(res); };
          });
        };
        w.addEventListener('message', function(msg) {
          try { var d = JSON.parse(msg.data); } catch (x) { return; }
          if (d.type !== 'vk-bridge') return;
          if (d.method === 'VKWebAppInit') {
            b._initialized = true;
            w.dispatchEvent(new CustomEvent(d));
            b._callbacks.forEach(c => b.send(c.m, c.d));
          } else if (d.id) {
            if (w[d.id]) { w[d.id](d.result); delete w[d.id]; }
          }
        });
        w.dispatchEvent(new CustomEvent(e, detail: null));
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Меню -->
      <div id="menu-screen" class="container">
        <h1 style="text-align:center; color:#007fff; margin:10px 0">ROPEROK: КАРЬЕРА</h1>
        <div class="stats-box">
          <span>🪙 Монеты: <b id="ui-coins">0</b></span>
          <span>🏆 Рекорд: <b id="ui-highscore">0</b></span>
        </div>
        <div id="levels-list"></div>
        <button class="btn btn-gold" style="width:100%; margin-top:20px" onclick="changeScreen('shop')">🏪 МАГАЗИН НАГРАД</button>
      </div>

      <!-- Экран игры -->
      <div id="game-screen" class="container hidden">
        <h3 id="game-title">Играет: </h3>
        <h4 id="game-score">Счёт: 0</h4>
        <div class="game-area">
          <div class="hit-zone"></div>
          <div id="lane-0" class="lane"></div>
          <div id="lane-1" class="lane"></div>
          <div id="lane-2" class="lane"></div>
        </div>
        <div class="tap-buttons">
          <button class="btn btn-blue" style="width:33.33%" onclick="handleTap(0)">L</button>
          <button class="btn btn-blue" style="width:33.33%" onclick="handleTap(1)">C</button>
          <button class="btn btn-blue" style="width:33.33%" onclick="handleTap(2)">R</button>
        </div>
      </div>

      <!-- Магазин/архив -->
      <div id="shop-screen" class="container hidden">
        <h2>🏪 Секретный Архив</h2>
        <div id="archive-list"></div>
        <h2>🎨 Кастомизация нот</h2>
        <div id="skins-list"></div>
        <button class="btn btn-blue" style="width:100%; margin-top:20px" onclick="changeScreen('menu')">Назад в меню</button>
      </div>
    </div>

    <script>
      // Данные уровней
      const LEVELS_DATA = [
        {
          id: 1,
          title: "Путь из села (Intro)",
          album: "Из села",
          requiredScore: 0,
          notes: [
            { time: 1000, line: 0 },
            { time: 2000, line: 1 },
            { time: 3000, line: 2 },
            { time: 4000, line: 1 },
            { time: 5000, line: 0 }
          ]
        },
        {
          id: 2,
          title: "Аритмия (Radio Edit)",
          album: "Аритмия",
          requiredScore: 200,
          notes: [
            { time: 1000, line: 0 },
            { time: 1500, line: 1 },
            { time: 2000, line: 2 },
            { time: 2500, line: 1 },
            { time: 3000, line: 0 }
          ]
        },
        {
          id: 3,
          title: "Стена из звука",
          album: "Стена из звука",
          requiredScore: 400,
          notes: [
            { time: 800, line: 0 },
            { time: 1200, line: 2 },
            { time: 1600, line: 1 },
            { time: 2000, line: 0 },
            { time: 2400, line: 2 }
          ]
        }
      ];

      let coins = 0, highScore = 0, noteColor = '#4da6ff', userId = null, selectedLevel = null;
      let gameScore = 0, gameInterval = null, gameStartTime = 0;

      const archive = [
        { id: 'c1', title: "Как писалась 'Аритмия'", description: "Секретный факт: этот бит был придуман в 3 часа ночи на коленке.", cost: 100, isOwned: false },
        { id: 'c2', title: "Первый микрофон", description: "Запись первых треков в селе шла на обычный динамический микрофон.", cost: 300, isOwned: false }
      ];

      const skins = [
        { id: 's1', name: "Классика (Синий)", color: "#4da6ff", cost: 0, isOwned: true },
        { id: 's2', name: "Кислотный Неон", color: "#39ff14", cost: 150, isOwned: false }
      ];

      // Инициализация VK Bridge
      function initBridge() {
        vkBridge.send('VKWebAppInit');
        vkBridge.subscribe((e) => {
          if (e.detail.type === 'VKWebAppInitResult') {
            userId = e.detail.data.user_id;
            loadProgress();
          }
        });
      }

      // Загрузка прогресса из хранилища VK
      async function loadProgress() {
        if (!userId) return;
        try {
          const res = await vkBridge.send('VKWebAppStorageGet', { key: 'roperok_progress' });
          if (res.value) {
            const data = JSON.parse(res.value);
            coins = data.coins || 0;
            highScore = data.highScore || 0;
            data.ownedCards?.forEach(id => {
              const c = archive.find(x => x.id === id);
              if (c) c.isOwned = true;
            });
            data.ownedSkins?.forEach(id => {
              const s = skins.find(x => x.id === id);
              if (s) s.isOwned = true;
            });
          }
          updateUI();
        } catch (err) {
          console.error('Storage get error', err);
        }
      }

      // Сохранение прогресса
      async function saveProgress() {
        if (!userId) return;
        try {
          const data = JSON.stringify({
            coins,
            highScore,
            ownedCards: archive.filter(c => c.isOwned).map(c => c.id),
            ownedSkins: skins.filter(s => s.isOwned).map(s => s.id)
          });
          await vkBridge.send('VKWebAppStorageSet', { key: 'roperok_progress', value: data });
        } catch (err) {
          console.error('Storage set error', err);
        }
      }

      function updateUI() {
        document.getElementById('ui-coins').innerText = coins;
        document.getElementById('ui-highscore').innerText = highScore;

        const list = document.getElementById('levels-list');
        list.innerHTML = '';
        LEVELS_DATA.forEach(lvl => {
          const isUnlocked = highScore >= lvl.requiredScore;
          const card = document.createElement('div');
          card.className = `level-card ${!isUnlocked ? 'locked' : ''}`;
          card.innerHTML = `<div><h4 style="margin:0">${lvl.title}</h4><span style="font-size:12px;color:#aaa">${lvl.album}</span></div>`;
          if (isUnlocked) {
            const b = document.createElement('button');
            b.className = 'btn btn-blue';
            b.style.width = 'auto';
            b.style.padding = '8px 16px';
            b.style.margin = '0';
            b.innerText = 'СТАРТ';
            b.onclick = () => startGame(lvl);
            card.appendChild(b);
          } else {
            card.innerHTML += `<span style="font-size:11px;color:#ff4d4d">🔒 Нужен рекорд: ${lvl.requiredScore}</span>`;
          }
          list.appendChild(card);
        });

        // Архив
        const archList = document.getElementById('archive-list');
        archList.innerHTML = '';
        archive.forEach(c => {
          const div = document.createElement('div');
          div.className = 'shop-card';
          div.innerHTML = `<h4>${c.title}</h4><p style="font-size:14px;color:#ccc">${c.description}</p>`;
          if (c.isOwned) {
            div.innerHTML += `<span style="color:#39ff14;font-weight:bold">✓ Открыто в архиве</span>`;
          } else {
            const b = document.createElement('button');
            b.className = 'btn btn-blue';
            b.innerText = `Купить за ${c.cost} 🪙`;
            b.disabled = coins < c.cost;
            b.onclick = () => buyCard(c.id, c.cost);
            div.appendChild(b);
          }
          archList.appendChild(div);
        });

        // Скины
        const sList = document.getElementById('skins-list');
        sList.innerHTML = '';
        skins.forEach(s => {
          const div = document.createElement('div');
          div.className = 'shop-card';
          div.style.display = 'flex';
          div.style.justifyContent = 'space-between';
          div.style.alignItems = 'center';
          div.innerHTML = `<div><span style="color:${s.color};font-weight:bold">■</span> ${s.name}</div>`;
          const b = document.createElement('button');
          b.className = 'btn btn-grey';
          b.style.width = 'auto';
          b.style.padding = '8px 16px';
          if (s.isOwned) {
            b.innerText = noteColor === s.color ? 'Выбрано' : 'Надеть';
            b.onclick
